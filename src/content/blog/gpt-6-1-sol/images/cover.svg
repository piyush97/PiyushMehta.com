<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GPT-6.1 Sol versus Astra</title>
  <desc id="desc">Standard input tokens cost two dollars per million on Sol and ten dollars on Astra. Quality still needs a task-specific evaluation.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#222640"/>
      <stop offset="1" stop-color="#171A2F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#343A5F" stroke-opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F1221"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="40" width="1104" height="550" rx="16" fill="url(#paper)" stroke="#343A5F" stroke-width="2"/>
  <text x="88" y="100" fill="#FFCC68" font-family="monospace" font-size="20" font-weight="700" letter-spacing="3">MODEL SELECTION / FIELD NOTE</text>
  <text x="88" y="169" fill="#F6F7FF" font-family="Arial,sans-serif" font-size="54" font-weight="700">GPT-6.1 Sol vs Astra</text>
  <text x="88" y="213" fill="#B4BAD8" font-family="Arial,sans-serif" font-size="23">Five times cheaper tokens. The same quality? Run the eval.</text>
  <line x1="88" y1="245" x2="1112" y2="245" stroke="#343A5F" stroke-width="2"/>
  <text x="88" y="293" fill="#B4BAD8" font-family="monospace" font-size="17" letter-spacing="2">STANDARD INPUT / 1M TOKENS</text>
  <rect x="88" y="326" width="475" height="156" rx="12" fill="#0F1221" stroke="#FFCC68" stroke-width="2"/>
  <rect x="589" y="326" width="523" height="156" rx="12" fill="#0F1221" stroke="#343A5F" stroke-width="2"/>
  <text x="116" y="365" fill="#FFCC68" font-family="monospace" font-size="18" font-weight="700">SOL</text>
  <text x="116" y="449" fill="#F6F7FF" font-family="Arial,sans-serif" font-size="76" font-weight="700">$2</text>
  <text x="294" y="448" fill="#A8E6B8" font-family="monospace" font-size="18">LOWER COST</text>
  <text x="617" y="365" fill="#B4BAD8" font-family="monospace" font-size="18" font-weight="700">ASTRA</text>
  <text x="617" y="449" fill="#F6F7FF" font-family="Arial,sans-serif" font-size="76" font-weight="700">$10</text>
  <text x="833" y="448" fill="#B4BAD8" font-family="monospace" font-size="18">QUALITY BASELINE</text>
  <text x="88" y="545" fill="#B4BAD8" font-family="monospace" font-size="17">Price is published. Your pass rate is not.</text>
</svg>
