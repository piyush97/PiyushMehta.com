name: Newsletter

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Post directory name under src/content/blog
        required: true
        type: string
      send:
        description: Deliver the email (false is a dry run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send:
    name: Send new post email
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Email subscribers
        # Inputs land in env, never interpolated into the shell line.
        run: |
          args=()
          if [ "$SEND" = "true" ]; then args+=(--send); fi
          bun scripts/send-new-post.mjs "$SLUG" "${args[@]}"
        env:
          SLUG: ${{ inputs.slug }}
          SEND: ${{ inputs.send }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEWSLETTER_SIGNING_SECRET: ${{ secrets.NEWSLETTER_SIGNING_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
