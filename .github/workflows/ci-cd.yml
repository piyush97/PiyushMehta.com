name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code quality checks
        run: bun run check

      - name: Production audit
        run: bun audit --prod --audit-level=high

      - name: Run unit tests
        run: bun run test:unit

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify post manifest
        run: bun run check:posts

      - name: Build project
        run: bun run build

      - name: Verify release artifacts
        run: bun run check:release

  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run smoke tests
        run: bunx playwright test tests/*.spec.ts --project=chromium
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: test-reports/playwright-html-report
          retention-days: 7

  e2e-webkit:
    name: E2E ${{ matrix.project }} (non-blocking)
    runs-on: ubuntu-latest
    # Report-only until existing WebKit failures are triaged; Chromium stays the gate.
    continue-on-error: true
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [webkit, mobile-safari]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright WebKit
        run: bunx playwright install --with-deps webkit

      - name: Run WebKit tests
        # Report-only job: no retries, parallel workers, short assertion timeout so known failures fail fast.
        run: bunx playwright test tests/*.spec.ts --project="$PW_PROJECT" --retries=0 --workers=4
        env:
          CI: true
          PW_PROJECT: ${{ matrix.project }}
          PW_EXPECT_TIMEOUT: 10000

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: test-reports/playwright-html-report
          retention-days: 7

  security-config:
    name: Security Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify security middleware
        run: |
          if [ ! -f "src/middleware/security.ts" ]; then
            echo "Security middleware not found"
            exit 1
          fi
          echo "Security middleware found"

          grep -q "Content-Security-Policy" src/middleware/security.ts \
            && echo "CSP configured" \
            || { echo "Content-Security-Policy missing"; exit 1; }

          grep -q "X-Frame-Options" src/middleware/security.ts \
            && echo "X-Frame-Options configured" \
            || echo "Warning: X-Frame-Options missing"

          grep -q "X-Content-Type-Options" src/middleware/security.ts \
            && echo "X-Content-Type-Options configured" \
            || echo "Warning: X-Content-Type-Options missing"

          grep -q "Referrer-Policy" src/middleware/security.ts \
            && echo "Referrer-Policy configured" \
            || echo "Warning: Referrer-Policy missing"

      - name: Enforce tightened CSP
        run: |
          csp=src/utils/request-security.ts
          grep -q "default-src" "$csp"
          for token in "'unsafe-eval'" googletagmanager google-analytics gstatic cdnjs jsdelivr; do
            if grep -q "$token" "$csp"; then
              echo "Forbidden CSP token: $token"
              exit 1
            fi
          done
          mapfile -t files < <(grep -rl --include=*.ts "default-src" src/)
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$csp" ]; then
            echo "CSP literal must live only in $csp"
            exit 1
          fi
