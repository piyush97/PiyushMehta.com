name: Automated Dependency Updates

on:
  schedule:
    # Weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-updates:
    name: Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update dependencies
        run: bun update

      - name: Run quality checks after update
        run: bun run check
        continue-on-error: true

      - name: Run build after update
        run: bun run build
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package.json bun.lock; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create dependency update PR
        if: steps.changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265e3f60f2ea40e5a42ec7c2c0c987 # v7.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "chore: weekly dependency updates"
          body: |
            ## Automated Dependency Updates

            Weekly patch/minor version updates generated by `bun update`.

            **Manual review required:**
            - Check for unexpected behavior changes
            - Review changelogs of updated packages
            - Test critical functionality

            ---
            *Generated automatically by the weekly dependency update workflow*
          branch: dependency-updates
          delete-branch: true
          labels: |
            dependencies
            maintenance
            automated
