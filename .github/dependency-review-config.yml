# Dependency Review Configuration
# https://github.com/actions/dependency-review-action#configuration

fail-on-severity: 'critical'

allow-licenses:
  - 'MIT'
  - 'Apache-2.0'
  - 'BSD-2-Clause'
  - 'BSD-3-Clause'
  - 'ISC'
  - 'Unlicense'
  - 'CC0-1.0'

deny-licenses:
  - 'GPL-2.0'
  - 'GPL-3.0'
  - 'AGPL-1.0'
  - 'AGPL-3.0'

vulnerability-check: true
license-check: true
