<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RoastTube: Let AI Roast Your YouTube Decisions and History</title>
  <desc id="desc">A newsprint verdict card. A sample Brain Rot Score of 42 sits beside a red ON THE RECORD stamp, with the pipeline from read-only Google access to signals, computed score and a Gemini-written roast.</desc>
  <rect width="1200" height="630" fill="#f3efe4"/>

  <g stroke="#1a1613" stroke-opacity="0.35">
    <path d="M64 56h1072"/>
    <path d="M64 380h1072"/>
    <path d="M64 574h1072"/>
  </g>

  <text x="64" y="40" fill="#57493c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">PIYUSHMEHTA.COM / FIELD NOTE</text>
  <text x="1136" y="40" fill="#57493c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">18 OCT 2026</text>

  <text x="64" y="152" fill="#1a1613" font-family="Anton, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="1">ROASTTUBE</text>

  <g transform="rotate(-4 968 124)">
    <rect x="818" y="92" width="300" height="64" rx="8" fill="none" stroke="#b3221f" stroke-width="4"/>
    <text x="968" y="135" fill="#b3221f" text-anchor="middle" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3">ON THE RECORD</text>
  </g>

  <rect x="64" y="186" width="1072" height="4" fill="#1a1613"/>
  <rect x="64" y="192" width="1072" height="1" fill="#1a1613"/>

  <text x="64" y="256" fill="#1a1613" font-family="Georgia, 'Times New Roman', serif" font-size="40">The court of one reads your likes,</text>
  <text x="64" y="308" fill="#1a1613" font-family="Georgia, 'Times New Roman', serif" font-size="40">scores your taste, and prints the verdict.</text>

  <text x="64" y="432" fill="#57493c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">SAMPLE VERDICT</text>
  <text x="62" y="540" fill="#1a1613" font-family="'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="700">42</text>
  <text x="64" y="566" fill="#57493c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">BRAIN ROT SCORE / 100</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="380" y="470" width="228" height="60" rx="6" fill="#f3efe4" stroke="#1a1613" stroke-opacity="0.45"/>
    <text x="400" y="494" fill="#57493c" font-size="11" letter-spacing="1.6">READ-ONLY SCOPE</text>
    <text x="400" y="516" fill="#1a1613" font-size="15">google oauth</text>

    <path d="M618 500h30" stroke="#b3221f" stroke-width="3"/>
    <path d="m642 493 9 7-9 7" fill="none" stroke="#b3221f" stroke-width="3"/>

    <rect x="660" y="470" width="228" height="60" rx="6" fill="#f3efe4" stroke="#1a1613" stroke-opacity="0.45"/>
    <text x="680" y="494" fill="#57493c" font-size="11" letter-spacing="1.6">COMPUTED IN CODE</text>
    <text x="680" y="516" fill="#1a1613" font-size="15">signals + score</text>

    <path d="M898 500h30" stroke="#b3221f" stroke-width="3"/>
    <path d="m922 493 9 7-9 7" fill="none" stroke="#b3221f" stroke-width="3"/>

    <rect x="940" y="470" width="196" height="60" rx="6" fill="#1a1613"/>
    <text x="960" y="494" fill="#f3efe4" fill-opacity="0.7" font-size="11" letter-spacing="1.6">MODEL WRITES</text>
    <text x="960" y="516" fill="#f3efe4" font-size="15">the roast</text>
  </g>

  <text x="64" y="602" fill="#57493c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">roasttube.piyushmehta.com</text>
  <text x="1136" y="602" fill="#57493c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">A COURT OF ONE JURY OF ONE</text>
</svg>
