  <g transform="translate(60, 560)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#22d3ee">
    <rect x="0" y="-18" width="84" height="26" rx="13" fill="none" stroke="#22d3ee"/>
