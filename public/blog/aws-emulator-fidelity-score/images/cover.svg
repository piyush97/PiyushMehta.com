<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">AWS Emulator fidelity by unit type: 75.4 percent overall, 56.3 percent on wire workflows, 95.5 percent on a serverless call set, 26.7 percent for CloudFormation</title>
  <desc id="description">Four horizontal bars comparing measured pass rates from the AWS Emulator v1.0.544 score file, with CloudFormation highlighted as the worst service.</desc>
  <rect width="1200" height="630" fill="#0b1220"/>
  <text x="80" y="90" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="21" letter-spacing="2">AWS EMULATOR v1.0.544 · 46,026 SCORED UNITS</text>
  <text x="80" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="50" font-weight="700">Fidelity is per behavior.</text>
  <text x="80" y="214" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="50" font-weight="700">Your suite picks the ones.</text>

  <g font-family="system-ui, sans-serif">
    <text x="80" y="308" fill="#e2e8f0" font-size="24">All scored units</text>
    <rect x="420" y="282" width="620" height="34" rx="6" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <rect x="420" y="282" width="467" height="34" rx="6" fill="#1d4ed8"/>
    <text x="1100" y="308" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="24" text-anchor="end">75.4%</text>

    <text x="80" y="380" fill="#e2e8f0" font-size="24">Wire-level workflows</text>
    <rect x="420" y="354" width="620" height="34" rx="6" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <rect x="420" y="354" width="349" height="34" rx="6" fill="#1d4ed8"/>
    <text x="1100" y="380" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="24" text-anchor="end">56.3%</text>

    <text x="80" y="452" fill="#e2e8f0" font-size="24">Serverless call set</text>
    <rect x="420" y="426" width="620" height="34" rx="6" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <rect x="420" y="426" width="592" height="34" rx="6" fill="#1d4ed8"/>
    <text x="1100" y="452" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="24" text-anchor="end">95.5%</text>

    <text x="80" y="524" fill="#fca5a5" font-size="24">CloudFormation</text>
    <rect x="420" y="498" width="620" height="34" rx="6" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <rect x="420" y="498" width="166" height="34" rx="6" fill="#e11d48"/>
    <text x="1100" y="524" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="24" text-anchor="end">26.7%</text>
  </g>

  <text x="80" y="590" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="19">recomputed from scores.json.gz, scored 2026-11-20</text>
  <text x="1120" y="590" fill="#475569" font-family="ui-monospace, monospace" font-size="17" text-anchor="end">piyushmehta.com</text>
</svg>
