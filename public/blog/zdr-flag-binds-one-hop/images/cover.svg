<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A prompt crossing three hops: a gateway holding a ZDR label, a provider logging requests, and an undisclosed upstream; canary hits fire at the provider and the upstream while the ZDR label stays attached to the gateway">
  <rect width="1200" height="630" fill="#171a2f"/>
  <g stroke="#343a5f" stroke-opacity="0.22"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/></g>
  <g font-family="Muli, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="88" y="112" fill="#f6f7ff" font-size="50" font-weight="800">Your ZDR flag</text>
    <text x="88" y="172" fill="#f6f7ff" font-size="50" font-weight="800">binds one hop.</text>
    <text x="88" y="214" fill="#8f96ba" font-size="22" font-weight="600">Two million canary prompts traced through routers, resellers and upstreams.</text>

    <!-- hop chain -->
    <g>
      <rect x="88" y="258" width="288" height="120" rx="10" fill="#23274a" stroke="#3fb950"/>
      <text x="112" y="292" fill="#8f96ba" font-size="15" font-weight="700">HOP 1</text>
      <text x="112" y="322" fill="#f6f7ff" font-size="24" font-weight="800">gateway</text>
      <rect x="112" y="336" width="180" height="26" rx="4" fill="#262b4d" stroke="#5d668f"/>
      <text x="122" y="354" fill="#c7cdec" font-size="15" font-weight="700">ZDR: on</text>

      <path d="M388 318h44" stroke="#5d668f" stroke-width="3"/>
      <path d="M428 312l10 6-10 6z" fill="#5d668f"/>

      <rect x="444" y="258" width="288" height="120" rx="10" fill="#2a2418" stroke="#d29922"/>
      <text x="468" y="292" fill="#8f96ba" font-size="15" font-weight="700">HOP 2</text>
      <text x="468" y="322" fill="#f6f7ff" font-size="24" font-weight="800">provider A</text>
      <text x="468" y="354" fill="#ffcc68" font-size="15" font-weight="700">request logging on</text>

      <path d="M744 318h44" stroke="#5d668f" stroke-width="3"/>
      <path d="M784 312l10 6-10 6z" fill="#5d668f"/>

      <rect x="800" y="258" width="312" height="120" rx="10" fill="#2a1f33" stroke="#f85149"/>
      <text x="824" y="292" fill="#8f96ba" font-size="15" font-weight="700">HOP 3</text>
      <text x="824" y="322" fill="#f6f7ff" font-size="24" font-weight="800">upstream</text>
      <text x="824" y="354" fill="#ff9a92" font-size="15" font-weight="700">not on the advertised path</text>
    </g>

    <!-- canary firings -->
    <g font-size="15" font-weight="700">
      <text x="88" y="428" fill="#8f96ba" font-size="15" font-weight="700">CANARY HITS</text>
      <circle cx="470" cy="423" r="6" fill="#d29922"/>
      <text x="484" y="428" fill="#ffcc68">p1, p2 read from a log export</text>
      <circle cx="470" cy="455" r="6" fill="#f85149"/>
      <text x="484" y="460" fill="#ff9a92">p3, p4 fetched from an unidentified network</text>
      <circle cx="470" cy="487" r="6" fill="#3fb950"/>
      <text x="484" y="492" fill="#7ee2a8">control route: no hits at all</text>
    </g>

    <line x1="88" y1="536" x2="1112" y2="536" stroke="#343a5f"/>
    <text x="88" y="574" fill="#8f96ba" font-size="19">2,000,000 seeded prompts · 3 providers breached · 125 endpoints delisted from ZDR</text>
    <text x="88" y="604" fill="#6f78a0" font-size="16">Dragos · OpenRouter · Novita · Phala · Together · November 2026</text>
  </g>
</svg>
