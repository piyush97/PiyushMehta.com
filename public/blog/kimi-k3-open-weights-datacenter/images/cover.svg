  <text x="72" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="760" fill="#f8fafc">KIMI K3</text>
  <text x="72" y="224" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="650" fill="#bae6fd">Downloadable does not mean local.</text>

