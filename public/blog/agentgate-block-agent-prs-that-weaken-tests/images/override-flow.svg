<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="agentgate flow: the PR diff and the config from the base commit go into five rules. A block can only become a warning when a human who is not the PR author applies the approval label on that run.">
  <rect width="1200" height="440" fill="#171a2f"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8f96ba"/></marker></defs>
  <g font-family="Muli, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f6f7ff">
    <rect x="40" y="60" width="240" height="96" rx="10" fill="#23274a" stroke="#343a5f"/>
    <text x="160" y="102" font-size="22" font-weight="800" text-anchor="middle">PR diff</text>
    <text x="160" y="132" font-size="17" fill="#8f96ba" text-anchor="middle">base...head (untrusted)</text>
    <rect x="40" y="200" width="240" height="96" rx="10" fill="#23274a" stroke="#343a5f"/>
    <text x="160" y="242" font-size="22" font-weight="800" text-anchor="middle">.agentgate.json</text>
    <text x="160" y="272" font-size="17" fill="#8f96ba" text-anchor="middle">read from base commit</text>

    <rect x="380" y="120" width="250" height="120" rx="10" fill="#23274a" stroke="#ffcc68"/>
    <text x="505" y="168" font-size="24" font-weight="800" text-anchor="middle">5 rules</text>
    <text x="505" y="200" font-size="17" fill="#8f96ba" text-anchor="middle">pure diff checks</text>

    <rect x="730" y="40" width="200" height="80" rx="10" fill="#1f3326" stroke="#3fb950"/>
    <text x="830" y="88" font-size="22" font-weight="800" text-anchor="middle">pass / warn</text>
    <rect x="730" y="240" width="200" height="80" rx="10" fill="#2a1f33" stroke="#f85149"/>
    <text x="830" y="288" font-size="22" font-weight="800" text-anchor="middle">block (exit 1)</text>

    <rect x="980" y="140" width="190" height="120" rx="10" fill="#23274a" stroke="#343a5f"/>
    <text x="1075" y="180" font-size="20" font-weight="800" text-anchor="middle">human label</text>
    <text x="1075" y="208" font-size="15" fill="#8f96ba" text-anchor="middle">not a bot</text>
    <text x="1075" y="228" font-size="15" fill="#8f96ba" text-anchor="middle">not the PR author</text>
    <text x="1075" y="248" font-size="15" fill="#8f96ba" text-anchor="middle">fresh on this run</text>

    <g stroke="#8f96ba" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M280 108C330 108 330 160 378 160"/>
      <path d="M280 248C330 248 330 200 378 200"/>
      <path d="M630 160C680 160 680 80 728 80"/>
      <path d="M630 200C680 200 680 280 728 280"/>
    </g>
    <path d="M1075 260C1075 330 960 330 932 296" stroke="#ffcc68" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#a)"/>
    <text x="1010" y="352" font-size="16" fill="#ffcc68" text-anchor="middle">block becomes warn</text>
    <text x="40" y="400" font-size="17" fill="#8f96ba">Nothing from the PR runs. API errors, missing history, or a shallow clone keep the block (exit 2).</text>
  </g>
</svg>
