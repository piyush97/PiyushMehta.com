<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="An agent PR that skips a test and widens workflow permissions: CI is green, agentgate blocks it with six findings">
  <rect width="1200" height="630" fill="#171a2f"/>
  <g stroke="#343a5f" stroke-opacity="0.22"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/></g>
  <g font-family="Muli, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="88" y="130" fill="#f6f7ff" font-size="54" font-weight="800">The fastest way to green CI</text>
    <text x="88" y="196" fill="#f6f7ff" font-size="54" font-weight="800">is to delete the check.</text>
    <text x="88" y="246" fill="#8f96ba" font-size="24" font-weight="600">agentgate: an open-source GitHub Action that notices</text>

    <rect x="88" y="300" width="1024" height="96" rx="10" fill="#23274a" stroke="#343a5f"/>
    <circle cx="140" cy="348" r="20" fill="#3fb950"/>
    <path d="M130 348l7 7 13-14" stroke="#171a2f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="182" y="342" fill="#f6f7ff" font-size="28" font-weight="800">ci / test</text>
    <text x="182" y="374" fill="#8f96ba" font-size="20">All tests passed (one of them is now test.skip)</text>

    <rect x="88" y="420" width="1024" height="96" rx="10" fill="#2a1f33" stroke="#f85149"/>
    <circle cx="140" cy="468" r="20" fill="#f85149"/>
    <path d="M131 459l18 18M149 459l-18 18" stroke="#171a2f" stroke-width="5" stroke-linecap="round"/>
    <text x="182" y="462" fill="#f6f7ff" font-size="28" font-weight="800">agentgate: BLOCK</text>
    <text x="182" y="494" fill="#ffcc68" font-size="20">test skipped · assertion removed · pull_request_target · contents: write · unpinned action</text>
    <text x="88" y="580" fill="#8f96ba" font-size="20">github.com/piyush97/agentgate · MIT · zero runtime dependencies</text>
  </g>
</svg>
