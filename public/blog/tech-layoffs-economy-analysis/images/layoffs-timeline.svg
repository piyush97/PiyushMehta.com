<svg width="860" height="380" viewBox="0 0 860 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="redBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="redBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4757"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9f43"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
  </defs>

  <rect width="860" height="380" rx="12" fill="url(#bg)"/>
  <rect width="860" height="380" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="38" fill="#e6edf3" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Tech Layoffs by Year (Thousands of Workers)</text>
  <line x1="80" y1="50" x2="780" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- Y-axis label -->
  <text x="28" y="200" fill="#6e7681" font-family="Arial" font-size="11" text-anchor="middle" transform="rotate(-90, 28, 200)">Workers (thousands)</text>

  <!-- Grid lines -->
  <line x1="120" y1="70" x2="120" y2="310" stroke="#21262d" stroke-width="1"/>
  <line x1="120" y1="70" x2="800" y2="70" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
  <text x="110" y="74" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">300K</text>
  <line x1="120" y1="110" x2="800" y2="110" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
  <text x="110" y="114" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">250K</text>
  <line x1="120" y1="150" x2="800" y2="150" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
  <text x="110" y="154" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">200K</text>
  <line x1="120" y1="190" x2="800" y2="190" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
  <text x="110" y="194" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">150K</text>
  <line x1="120" y1="230" x2="800" y2="230" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
  <text x="110" y="234" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">100K</text>
  <line x1="120" y1="270" x2="800" y2="270" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
  <text x="110" y="274" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">50K</text>
  <line x1="120" y1="310" x2="800" y2="310" stroke="#30363d" stroke-width="1"/>

  <!-- Bars: scale: 300K = 240px, so 1K = 0.8px -->
  <!-- 2019: ~10K jobs cut (normal churn) -->
  <rect x="148" y="302" width="80" height="8" fill="#2ecc71" rx="3" opacity="0.7"/>
  <text x="188" y="298" fill="#2ecc71" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">~10K</text>
  <text x="188" y="328" fill="#8b949e" font-family="Arial" font-size="13" text-anchor="middle">2019</text>

  <!-- 2020: ~80K -->
  <rect x="270" y="246" width="80" height="64" fill="#f1c40f" rx="3" opacity="0.75"/>
  <text x="310" y="241" fill="#f1c40f" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">80K</text>
  <text x="310" y="328" fill="#8b949e" font-family="Arial" font-size="13" text-anchor="middle">2020</text>

  <!-- 2021: ~15K (boom, barely any) -->
  <rect x="392" y="298" width="80" height="12" fill="url(#greenBar)" rx="3"/>
  <text x="432" y="293" fill="#2ecc71" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">15K</text>
  <text x="432" y="328" fill="#8b949e" font-family="Arial" font-size="13" text-anchor="middle">2021</text>

  <!-- 2022: ~165K -->
  <rect x="514" y="178" width="80" height="132" fill="url(#redBar1)" rx="3"/>
  <text x="554" y="173" fill="#e74c3c" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">165K</text>
  <text x="554" y="328" fill="#8b949e" font-family="Arial" font-size="13" text-anchor="middle">2022</text>

  <!-- 2023: ~265K (peak layoffs) -->
  <rect x="636" y="98" width="80" height="212" fill="url(#redBar2)" rx="3"/>
  <text x="676" y="93" fill="#ff4757" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">265K ⚠️</text>
  <text x="676" y="328" fill="#8b949e" font-family="Arial" font-size="13" text-anchor="middle">2023</text>

  <!-- 2024: ~150K -->
  <rect x="758" y="190" width="80" height="120" fill="url(#orangeBar)" rx="3"/>
  <text x="798" y="185" fill="#ff9f43" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">150K</text>
  <text x="798" y="328" fill="#8b949e" font-family="Arial" font-size="13" text-anchor="middle">2024</text>

  <!-- Annotation: "Boom era ends" -->
  <line x1="432" y1="290" x2="510" y2="230" stroke="#484f58" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="445" y="355" fill="#6e7681" font-family="Arial" font-size="10" text-anchor="middle">Boom era</text>
  <text x="445" y="367" fill="#6e7681" font-family="Arial" font-size="10" text-anchor="middle">ends →</text>

  <!-- Source -->
  <text x="430" y="365" fill="#484f58" font-family="Arial" font-size="10" text-anchor="middle">Source: Layoffs.fyi, TechCrunch, Crunchbase</text>
</svg>
