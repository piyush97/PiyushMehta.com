<svg width="860" height="380" viewBox="0 0 860 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="vacancyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="rentFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.02"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="380" rx="12" fill="url(#bg)"/>
  <rect width="860" height="380" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="38" fill="#e6edf3" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">San Francisco Office Vacancy Rate vs Tech Employment (2019–2024)</text>
  <line x1="80" y1="50" x2="780" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- Axes -->
  <line x1="120" y1="70" x2="120" y2="300" stroke="#30363d" stroke-width="1.5"/>
  <line x1="120" y1="300" x2="800" y2="300" stroke="#30363d" stroke-width="1.5"/>

  <!-- Y axis labels (vacancy %) -->
  <text x="108" y="74" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">40%</text>
  <text x="108" y="120" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">30%</text>
  <text x="108" y="166" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">20%</text>
  <text x="108" y="212" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">10%</text>
  <text x="108" y="258" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">5%</text>
  <text x="108" y="300" fill="#484f58" font-family="Arial" font-size="10" text-anchor="end">0%</text>

  <!-- Grid lines -->
  <line x1="120" y1="74" x2="800" y2="74" stroke="#21262d" stroke-width="0.5"/>
  <line x1="120" y1="120" x2="800" y2="120" stroke="#21262d" stroke-width="0.5"/>
  <line x1="120" y1="166" x2="800" y2="166" stroke="#21262d" stroke-width="0.5"/>
  <line x1="120" y1="212" x2="800" y2="212" stroke="#21262d" stroke-width="0.5"/>
  <line x1="120" y1="258" x2="800" y2="258" stroke="#21262d" stroke-width="0.5"/>

  <!-- X axis labels (years) — evenly spaced: 120 to 800 = 680px / 5 intervals = 136px each -->
  <text x="120" y="318" fill="#6e7681" font-family="Arial" font-size="12" text-anchor="middle">2019</text>
  <text x="256" y="318" fill="#6e7681" font-family="Arial" font-size="12" text-anchor="middle">2020</text>
  <text x="392" y="318" fill="#6e7681" font-family="Arial" font-size="12" text-anchor="middle">2021</text>
  <text x="528" y="318" fill="#6e7681" font-family="Arial" font-size="12" text-anchor="middle">2022</text>
  <text x="664" y="318" fill="#6e7681" font-family="Arial" font-size="12" text-anchor="middle">2023</text>
  <text x="800" y="318" fill="#6e7681" font-family="Arial" font-size="12" text-anchor="middle">2024</text>

  <!--
    Office Vacancy Rate (scale: 0% = y300, 40% = y74, so 1% = 5.65px)
    2019: 5%  → y = 300 - 5*5.65 = 271.8 ≈ 272
    2020: 12% → y = 300 - 12*5.65 = 232.2 ≈ 232
    2021: 15% → y = 300 - 15*5.65 = 215.3 ≈ 215
    2022: 24% → y = 300 - 24*5.65 = 164.4 ≈ 164
    2023: 32% → y = 300 - 32*5.65 = 119.2 ≈ 119
    2024: 36% → y = 300 - 36*5.65 = 96.6 ≈ 97
  -->
  <!-- Vacancy area fill -->
  <path d="M 120 272 L 256 232 L 392 215 L 528 164 L 664 119 L 800 97 L 800 300 L 120 300 Z"
        fill="url(#vacancyFill)"/>
  <!-- Vacancy line -->
  <polyline points="120,272 256,232 392,215 528,164 664,119 800,97"
            stroke="#ff4757" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <!-- Vacancy dots -->
  <circle cx="120" cy="272" r="5" fill="#ff4757"/>
  <circle cx="256" cy="232" r="5" fill="#ff4757"/>
  <circle cx="392" cy="215" r="5" fill="#ff4757"/>
  <circle cx="528" cy="164" r="5" fill="#ff4757"/>
  <circle cx="664" cy="119" r="5" fill="#ff4757"/>
  <circle cx="800" cy="97" r="5" fill="#ff4757" filter="url(#glow)"/>

  <!-- Value labels for vacancy -->
  <text x="120" y="267" fill="#ff4757" font-family="Arial" font-size="10" text-anchor="middle">5%</text>
  <text x="256" y="227" fill="#ff4757" font-family="Arial" font-size="10" text-anchor="middle">12%</text>
  <text x="392" y="210" fill="#ff4757" font-family="Arial" font-size="10" text-anchor="middle">15%</text>
  <text x="528" y="159" fill="#ff4757" font-family="Arial" font-size="10" text-anchor="middle">24%</text>
  <text x="664" y="114" fill="#ff4757" font-family="Arial" font-size="10" text-anchor="middle">32%</text>
  <text x="800" y="92" fill="#ff4757" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">36%</text>

  <!-- Annotation: layoff wave start -->
  <line x1="528" y1="80" x2="528" y2="300" stroke="#484f58" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="532" y="82" fill="#6e7681" font-family="Arial" font-size="10">Layoff wave begins</text>

  <!-- Legend -->
  <rect x="580" y="60" width="200" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="594" y1="78" x2="614" y2="78" stroke="#ff4757" stroke-width="2.5"/>
  <circle cx="604" cy="78" r="4" fill="#ff4757"/>
  <text x="620" y="82" fill="#e6edf3" font-family="Arial" font-size="12">Office Vacancy Rate</text>
  <text x="594" y="98" fill="#484f58" font-family="Arial" font-size="10">San Francisco commercial real estate</text>

  <!-- Source -->
  <text x="430" y="365" fill="#484f58" font-family="Arial" font-size="10" text-anchor="middle">Source: CBRE, Cushman &amp; Wakefield, SF Planning Dept 2024</text>
</svg>
