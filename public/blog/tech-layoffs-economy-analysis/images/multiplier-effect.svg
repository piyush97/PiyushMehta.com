<svg width="860" height="420" viewBox="0 0 860 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="420" rx="12" fill="url(#bg)"/>
  <rect width="860" height="420" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="40" fill="#e6edf3" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">The Local Multiplier Effect: 1 Tech Job → 4–5 Downstream Jobs</text>
  <line x1="80" y1="52" x2="780" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- Center: Tech worker -->
  <circle cx="430" cy="220" r="44" fill="#1f2937" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)"/>
  <text x="430" y="212" fill="#3b82f6" font-family="Arial" font-size="24" text-anchor="middle">💻</text>
  <text x="430" y="234" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">TECH</text>
  <text x="430" y="248" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">WORKER</text>
  <text x="430" y="275" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">$130K–$220K</text>

  <!-- Multiplier label -->
  <rect x="338" y="290" width="184" height="24" rx="12" fill="#1f2d3d" stroke="#3b82f6" stroke-width="1"/>
  <text x="430" y="306" fill="#3b82f6" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">× 4–5 local jobs created</text>

  <!-- Downstream nodes with connecting lines -->

  <!-- 1: Restaurant / Hospitality (top) -->
  <line x1="430" y1="176" x2="430" y2="110" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <circle cx="430" cy="96" r="32" fill="#1f2937" stroke="#ff9f43" stroke-width="2"/>
  <text x="430" y="88" fill="#ff9f43" font-family="Arial" font-size="20" text-anchor="middle">🍽️</text>
  <text x="430" y="106" fill="#ff9f43" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Restaurants</text>
  <text x="430" y="118" fill="#6e7681" font-family="Arial" font-size="9" text-anchor="middle">&amp; Hospitality</text>

  <!-- 2: Childcare (top-right) -->
  <line x1="468" y1="186" x2="600" y2="130" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <circle cx="618" cy="120" r="32" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
  <text x="618" y="112" fill="#a78bfa" font-family="Arial" font-size="20" text-anchor="middle">👶</text>
  <text x="618" y="130" fill="#a78bfa" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Childcare</text>
  <text x="618" y="142" fill="#6e7681" font-family="Arial" font-size="9" text-anchor="middle">&amp; Education</text>

  <!-- 3: Construction (right) -->
  <line x1="474" y1="220" x2="680" y2="220" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <circle cx="712" cy="220" r="32" fill="#1f2937" stroke="#34d399" stroke-width="2"/>
  <text x="712" y="212" fill="#34d399" font-family="Arial" font-size="20" text-anchor="middle">🏗️</text>
  <text x="712" y="230" fill="#34d399" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Construction</text>
  <text x="712" y="242" fill="#6e7681" font-family="Arial" font-size="9" text-anchor="middle">&amp; Real Estate</text>

  <!-- 4: Retail (bottom-right) -->
  <line x1="468" y1="254" x2="600" y2="310" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <circle cx="618" cy="322" r="32" fill="#1f2937" stroke="#f472b6" stroke-width="2"/>
  <text x="618" y="314" fill="#f472b6" font-family="Arial" font-size="20" text-anchor="middle">🛍️</text>
  <text x="618" y="332" fill="#f472b6" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Retail</text>
  <text x="618" y="344" fill="#6e7681" font-family="Arial" font-size="9" text-anchor="middle">&amp; Services</text>

  <!-- 5: Healthcare (bottom) -->
  <line x1="430" y1="264" x2="430" y2="328" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <circle cx="430" cy="344" r="32" fill="#1f2937" stroke="#fb923c" stroke-width="2"/>
  <text x="430" y="336" fill="#fb923c" font-family="Arial" font-size="20" text-anchor="middle">🏥</text>
  <text x="430" y="354" fill="#fb923c" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Healthcare</text>
  <text x="430" y="366" fill="#6e7681" font-family="Arial" font-size="9" text-anchor="middle">&amp; Wellness</text>

  <!-- Left side: note -->
  <rect x="30" y="150" width="220" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="140" y="172" fill="#e6edf3" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">When 1 tech job is cut:</text>
  <text x="50" y="196" fill="#ff4757" font-family="Arial" font-size="12">→ Income effect: direct loss</text>
  <text x="50" y="216" fill="#ff9f43" font-family="Arial" font-size="12">→ 4–5 downstream jobs at risk</text>
  <text x="50" y="236" fill="#f1c40f" font-family="Arial" font-size="12">→ Local tax base shrinks</text>
  <text x="50" y="256" fill="#8b949e" font-family="Arial" font-size="11">Source: Enrico Moretti, UC Berkeley</text>
</svg>
