<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="macOSGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007aff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856d6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="archGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1793d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4c75;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d3748" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- macOS Logo (Left Side) -->
  <g transform="translate(150, 200)">
    <circle cx="50" cy="50" r="45" fill="url(#macOSGradient)" filter="url(#glow)"/>
    <!-- Apple logo simplified -->
    <path d="M 35 30 Q 50 20 65 30 Q 70 40 65 50 Q 60 60 50 65 Q 40 60 35 50 Q 30 40 35 30 Z" fill="white"/>
    <circle cx="55" cy="25" r="3" fill="white"/>
  </g>
  
  <!-- Plus Symbol (Center) -->
  <g transform="translate(380, 280)">
    <circle cx="20" cy="20" r="25" fill="#2d3748" stroke="#00d4aa" stroke-width="3"/>
    <path d="M 10 20 L 30 20 M 20 10 L 20 30" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="60" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#00d4aa">ADD</text>
  </g>
  
  <!-- Arch Linux Logo (Right Side) -->
  <g transform="translate(550, 200)">
    <circle cx="50" cy="50" r="45" fill="url(#archGradient)" filter="url(#glow)"/>
    <!-- Arch Linux logo -->
    <path d="M 50 25 L 35 75 L 40 75 L 45 60 L 55 60 L 60 75 L 65 75 Z M 47 50 L 53 50 L 50 40 Z" fill="white"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="bold" fill="white">
    Adding Arch Linux to My Arsenal
  </text>
  <text x="600" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="normal" fill="#94a3b8">
    A macOS Developer's Learning Journey
  </text>
  
  <!-- Feature Highlights -->
  <g transform="translate(100, 380)">
    <!-- Dual Systems -->
    <g>
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="20" y="25" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" fill="#00d4aa">⚖️ Dual Systems</text>
      <text x="20" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">MacBook M1 Pro 2021</text>
      <text x="20" y="65" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">+ Arch Linux laptop</text>
    </g>
    
    <!-- Learning Focus -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="20" y="25" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" fill="#00d4aa">📚 Learning</text>
      <text x="20" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">System mastery</text>
      <text x="20" y="65" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Complete control</text>
    </g>
    
    <!-- Flexibility -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="20" y="25" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" fill="#00d4aa">🔧 Flexibility</text>
      <text x="20" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Right tool for job</text>
      <text x="20" y="65" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Best of both worlds</text>
    </g>
    
    <!-- Skills -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="20" y="25" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" fill="#00d4aa">🚀 Skills</text>
      <text x="20" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Linux administration</text>
      <text x="20" y="65" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Platform diversity</text>
    </g>
  </g>
  
  <!-- Code Snippet -->
  <g transform="translate(150, 500)">
    <rect width="900" height="80" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="20" y="25" font-family="JetBrains Mono, monospace" font-size="14" fill="#7dd3fc"># Adding to the toolkit</text>
    <text x="20" y="45" font-family="JetBrains Mono, monospace" font-size="14" fill="#f8fafc">sudo pacman -Syu</text>
    <text x="20" y="65" font-family="JetBrains Mono, monospace" font-size="14" fill="#94a3b8"># Expanding horizons 🚀</text>
  </g>
  
  <!-- System Info Badge -->
  <g transform="translate(900, 20)">
    <rect width="280" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="20" font-family="JetBrains Mono, monospace" font-size="12" fill="#00d4aa">Dual Development Setup:</text>
    <text x="20" y="35" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">MacBook M1 Pro 2021 + macOS</text>
    <text x="20" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">Arch Linux + Hyprland</text>
    <text x="20" y="65" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">i7-1360P • 16GB • 838 pkgs</text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="2" fill="#00d4aa" opacity="0.6"/>
  <circle cx="1100" cy="500" r="3" fill="#1793d1" opacity="0.5"/>
  <circle cx="50" cy="550" r="1.5" fill="#5856d6" opacity="0.4"/>
  <circle cx="1150" cy="150" r="2.5" fill="#00b4d8" opacity="0.7"/>
  
  <!-- Author Credit -->
  <text x="1050" y="610" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">by Piyush Mehta</text>
</svg>