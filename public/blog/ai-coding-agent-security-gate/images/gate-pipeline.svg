<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Agent PR gate: an agent pull request runs unit tests plus three required jobs, Semgrep diff-aware SAST, gitleaks on PR commits, and a test-integrity check. Changes to gate files, monitoring, or auth also need CODEOWNERS review. Only when all pass does it merge.">
  <rect width="1200" height="520" fill="#171a2f"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8f96ba"/></marker></defs>
  <g font-family="Muli, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f6f7ff">
    <rect x="40" y="210" width="190" height="100" rx="10" fill="#23274a" stroke="#343a5f"/>
    <text x="135" y="252" font-size="24" font-weight="800" text-anchor="middle">Agent PR</text>
    <text x="135" y="282" font-size="17" fill="#8f96ba" text-anchor="middle">code + tests</text>

    <g stroke="#8f96ba" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M230 260C280 260 280 80 330 80"/><path d="M230 260C280 260 280 200 330 200"/>
      <path d="M230 260C280 260 280 320 330 320"/><path d="M230 260C280 260 280 440 330 440"/>
      <path d="M690 80C740 80 740 260 790 260"/><path d="M690 200C740 200 740 260 790 260"/>
      <path d="M690 320C740 320 740 260 790 260"/><path d="M690 440C740 440 740 260 790 260"/>
      <path d="M1000 260H1060"/>
    </g>

    <g font-size="21" font-weight="800">
      <rect x="330" y="40" width="360" height="80" rx="10" fill="#23274a" stroke="#343a5f"/>
      <text x="352" y="74">Unit tests</text><text x="352" y="102" font-size="16" font-weight="600" fill="#8f96ba">does what the spec asked</text>
      <rect x="330" y="160" width="360" height="80" rx="10" fill="#23274a" stroke="#ffcc68"/>
      <text x="352" y="194">Semgrep --baseline-commit</text><text x="352" y="222" font-size="16" font-weight="600" fill="#8f96ba">new injection / crypto findings</text>
      <rect x="330" y="280" width="360" height="80" rx="10" fill="#23274a" stroke="#ffcc68"/>
      <text x="352" y="314">gitleaks base..head</text><text x="352" y="342" font-size="16" font-weight="600" fill="#8f96ba">secrets in any PR commit</text>
      <rect x="330" y="400" width="360" height="80" rx="10" fill="#23274a" stroke="#ffcc68"/>
      <text x="352" y="434">Test integrity</text><text x="352" y="462" font-size="16" font-weight="600" fill="#8f96ba">deleted tests, lost asserts, skips</text>

      <rect x="790" y="200" width="210" height="120" rx="10" fill="#23274a" stroke="#ffcc68" stroke-dasharray="6 5"/>
      <text x="895" y="248" text-anchor="middle">CODEOWNERS</text>
      <text x="895" y="276" font-size="16" font-weight="600" fill="#8f96ba" text-anchor="middle">gate files, monitoring,</text>
      <text x="895" y="298" font-size="16" font-weight="600" fill="#8f96ba" text-anchor="middle">auth need a human</text>

      <rect x="1060" y="225" width="110" height="70" rx="10" fill="#ffcc68"/>
      <text x="1115" y="268" fill="#171a2f" text-anchor="middle">Merge</text>
    </g>
    <text x="330" y="26" font-size="15" fill="#8f96ba">Gold outline = added by this gate</text>
  </g>
</svg>
