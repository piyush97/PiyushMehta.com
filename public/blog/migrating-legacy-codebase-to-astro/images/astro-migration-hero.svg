<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2347;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282e5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e3360;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="url(#accent)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="url(#accent)" opacity="0.08"/>
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Old codebase representation -->
    <rect x="-200" y="-80" width="120" height="160" rx="8" fill="#374151" opacity="0.7"/>
    <rect x="-180" y="-60" width="80" height="4" rx="2" fill="#60a5fa"/>
    <rect x="-180" y="-40" width="60" height="4" rx="2" fill="#9ca3af"/>
    <rect x="-180" y="-20" width="90" height="4" rx="2" fill="#9ca3af"/>
    <rect x="-180" y="0" width="70" height="4" rx="2" fill="#9ca3af"/>
    
    <!-- Arrow -->
    <path d="M-40 -10 L-10 -10 L-10 -20 L20 -10 L-10 0 L-10 -10" fill="#60a5fa"/>
    
    <!-- New Astro codebase representation -->
    <rect x="80" y="-100" width="120" height="200" rx="8" fill="#60a5fa" opacity="0.9"/>
    <circle cx="140" cy="-60" r="20" fill="white"/>
    <text x="140" y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#60a5fa">A</text>
    <rect x="100" y="-30" width="80" height="4" rx="2" fill="white"/>
    <rect x="100" y="-10" width="60" height="4" rx="2" fill="white" opacity="0.7"/>
    <rect x="100" y="10" width="90" height="4" rx="2" fill="white" opacity="0.7"/>
    <rect x="100" y="30" width="70" height="4" rx="2" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">Astro Migration</text>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#d1d5db">Legacy to Modern</text>
  
  <!-- Website URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">piyushmehta.com</text>
</svg>
