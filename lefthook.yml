pre-commit:
  commands:
    react-doctor:
      run: bunx react-doctor --staged --fail-on error
    check:
      glob: '*.{astro,css,js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,mdx}'
      run: bunx vp check --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    varlock-scan:
      run: bunx varlock scan --staged
      fail_text: 'Sensitive values detected in staged files. Remove secrets before committing.'
