pre-commit:
  commands:
    react-doctor:
      run: react-doctor --staged --fail-on error
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    varlock-scan:
      run: bunx varlock scan --staged
      fail_text: "Sensitive values detected in staged files. Remove secrets before committing."
